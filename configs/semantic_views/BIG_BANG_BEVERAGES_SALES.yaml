verified_queries:
  - name: '"what are top selling brands in august 2025?"'
    sql: |-
      SELECT
        p.brand_name,
        SUM(s.quantity) AS total_quantity_sold
      FROM
        product_data_clean AS p
        INNER JOIN sales_data_summary AS s ON p.product_id = s.product_id
      WHERE
        DATE_TRUNC('MONTH', s.sales_date) = '2025-08-01'
      GROUP BY
        p.brand_name
      ORDER BY
        total_quantity_sold DESC NULLS LAST
    question: what are top selling brands in august 2025?
    verified_at: 1756334873
    verified_by: MICHAEL VOLLMER
    use_as_onboarding_question: false
  - name: '"What are my promotions?"'
    sql: |-
      SELECT
        DISTINCT s.promotion_name,
        MIN(s.sales_date) AS start_date,
        MAX(s.sales_date) AS end_date
      FROM
        sales_data_summary AS s
      WHERE
        NOT s.promotion_name IS NULL
      GROUP BY
        s.promotion_name
      ORDER BY
        s.promotion_name
    question: What are my promotions?
    verified_at: 1756353281
    verified_by: MICHAEL VOLLMER
    use_as_onboarding_question: false
  - name: '"What is the worse performing flavor this year?"'
    sql: |-
      SELECT
        p.flavor,
        MIN(s.sales_date) AS start_date,
        MAX(s.sales_date) AS end_date,
        SUM(s.total_sales_revenue) AS total_revenue
      FROM
        sales_data_summary AS s
        INNER JOIN product_data_clean AS p ON p.product_id = s.product_id
      WHERE
        DATE_PART('YEAR', s.sales_week_end_date) = 2025
      GROUP BY
        p.flavor
      ORDER BY
        total_revenue ASC
      LIMIT
        1
    question: What is the worse performing flavor this year?
    verified_at: 1756353530
    verified_by: MICHAEL VOLLMER
    use_as_onboarding_question: false
  - name: '"What region has the most sales this year?"'
    sql: |-
      SELECT
        st.metropolitan_area,
        MIN(s.sales_date) AS start_date,
        MAX(s.sales_date) AS end_date,
        SUM(s.total_sales_revenue) AS total_revenue
      FROM
        sales_data_summary AS s
        INNER JOIN store_data AS st ON st.store_id = s.store_id
      WHERE
        DATE_PART('YEAR', s.sales_week_end_date) = 2025
      GROUP BY
        st.metropolitan_area
      ORDER BY
        total_revenue DESC NULLS LAST
      LIMIT
        1
    question: What region has the most sales this year?
    verified_at: 1756353628
    verified_by: MICHAEL VOLLMER
    use_as_onboarding_question: false
  - name: '"What are the sales by region"'
    sql: |-
      SELECT
        st.metropolitan_area,
        MIN(s.sales_date) AS start_date,
        MAX(s.sales_date) AS end_date,
        SUM(s.total_sales_revenue) AS total_sales
      FROM
        sales_data_summary AS s
        INNER JOIN store_data AS st ON st.store_id = s.store_id
      GROUP BY
        st.metropolitan_area
      ORDER BY
        total_sales DESC NULLS LAST
    question: What are the sales by region
    verified_at: 1756353708
    verified_by: MICHAEL VOLLMER
    use_as_onboarding_question: false
