[project]
name = "cortex-agent"
version = "0.1.0"
description = "Config-as-code for Snowflake Cortex Agents: export, review, and redeploy agent definitions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "cryptography>=41.0",
    "python-dotenv>=1.0",
    "PyJWT[crypto]>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_agent"]
