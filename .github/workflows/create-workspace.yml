name: Create Dev Workspace

on:
  workflow_dispatch:
    inputs:
      developer:
        description: "Developer username (becomes DEV_<DEVELOPER> schema)"
        required: true
        type: string
      database:
        description: "Target database (leave empty to use SNOWFLAKE_DATABASE secret)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.pem

      - name: Create workspace
        env:
          CORTEX_AGENT_NAME: ${{ vars.CORTEX_AGENT_NAME }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.pem
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
        run: |
          args="--developer ${{ inputs.developer }}"
          if [ -n "${{ inputs.database }}" ]; then
            args="$args --database ${{ inputs.database }}"
          fi
          python scripts/create_workspace.py $args
