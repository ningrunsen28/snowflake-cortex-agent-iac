name: Deploy Agent

on:
  push:
    branches: [develop, main]
    paths:
      - "configs/agent_config.yaml"

  workflow_dispatch:
    inputs:
      mode:
        description: "Create mode"
        required: false
        default: "orReplace"
        type: choice
        options:
          - orReplace
          - ifNotExists
          - errorIfExists

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.pem

      - name: Deploy to Snowflake
        env:
          CORTEX_AGENT_NAME: ${{ secrets.CORTEX_AGENT_NAME }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.pem
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: |
          MODE="${{ inputs.mode || 'orReplace' }}"
          echo "Deploying at commit ${{ github.sha }}"
          python scripts/deploy_agent.py --mode "$MODE"
