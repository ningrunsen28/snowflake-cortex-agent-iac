name: Deploy Agent

on:
  push:
    branches: [develop, main]
    paths:
      - "configs/agent_config.yaml"

  workflow_dispatch:
    inputs:
      mode:
        description: "Create mode"
        required: false
        default: "orReplace"
        type: choice
        options:
          - orReplace
          - ifNotExists
          - errorIfExists

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Deploy to Snowflake
        env:
          CORTEX_AGENT_NAME: ${{ vars.CORTEX_AGENT_NAME }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.pem
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
        run: |
          MODE="${{ inputs.mode || 'orReplace' }}"
          echo "Deploying at commit ${{ github.sha }}"
          python scripts/deploy_agent.py --mode "$MODE"
