name: Cleanup Dev Workspace

on:
  pull_request:
    types: [closed]
  delete:

permissions:
  contents: read

jobs:
  resolve-developer:
    runs-on: ubuntu-latest
    outputs:
      developer: ${{ steps.resolve.outputs.developer }}
      should_run: ${{ steps.resolve.outputs.should_run }}
    steps:
      - name: Resolve developer from event
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DEVELOPER="${{ github.event.pull_request.user.login }}"
            echo "developer=$DEVELOPER" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "delete" ] && [ "${{ github.event.ref_type }}" = "branch" ]; then
            DEVELOPER="${{ github.actor }}"
            echo "developer=$DEVELOPER" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  cleanup:
    needs: resolve-developer
    if: needs.resolve-developer.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.pem

      - name: Cleanup workspace
        env:
          CORTEX_AGENT_NAME: ${{ vars.CORTEX_AGENT_NAME }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.pem
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
        run: |
          DEVELOPER="${{ needs.resolve-developer.outputs.developer }}"
          echo "Cleaning up workspace for developer: $DEVELOPER"
          python scripts/cleanup_workspace.py --developer "$DEVELOPER"
