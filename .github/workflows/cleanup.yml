name: Cleanup Dev Workspace

on:
  workflow_dispatch:
    inputs:
      developer:
        description: "Developer identifier used when creating the workspace (maps to DEV_<DEVELOPER>)"
        required: true
        type: string
      database:
        description: "Target database (leave empty to use SNOWFLAKE_DATABASE env var)"
        required: false
        type: string
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: development
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref, 'dev/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.pem

      - name: Cleanup workspace
        env:
          CORTEX_AGENT_NAME: ${{ vars.CORTEX_AGENT_NAME }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.pem
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.event.pull_request.head.ref }}"
            DEVELOPER="${BRANCH#dev/}"
          else
            DEVELOPER="${{ inputs.developer }}"
          fi
          args="--developer $DEVELOPER"
          if [ -n "${{ inputs.database }}" ]; then
            args="$args --database ${{ inputs.database }}"
          fi
          echo "Cleaning up workspace for developer: $DEVELOPER"
          python scripts/cleanup_workspace.py $args
